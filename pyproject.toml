[project]
name = "studio-buddy"
version = "0.1.0"
description = "A local-first musical companion for Renoise"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.8,<7", "openai>=2,<3", "httpx>=0.28,<1", "PyJWT[crypto]>=2.10,<3"]
[project.optional-dependencies]
renoise = ["mcp>=1.20,<2"]
speech = ["faster-whisper>=1,<2", "sounddevice>=0.4.6,<1", "numpy>=1.26,<3"]
[project.scripts]
studio-buddy = "studiobuddy.app:main"
studio-buddy-voice = "studiobuddy.voice_input:main"
studio-buddy-stt = "studiobuddy.speech_capture:main"
[dependency-groups]
dev = ["pytest>=8", "pytest-qt>=4", "pytest-asyncio>=1", "ruff>=0.14"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/studiobuddy"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
