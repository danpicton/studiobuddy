[project]
name = "studio-buddy"
version = "0.1.0"
description = "A local-first musical companion for Renoise"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.8,<7", "openai>=2,<3", "httpx>=0.28,<1", "mcp>=1.20,<2"]
[project.scripts]
studio-buddy = "studiobuddy.app:main"
[dependency-groups]
dev = ["pytest>=8", "pytest-qt>=4", "pytest-asyncio>=1", "ruff>=0.14"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/studiobuddy"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
